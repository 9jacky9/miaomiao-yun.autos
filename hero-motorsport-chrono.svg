<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="100%" height="100%">
  <defs>
    <linearGradient id="asphaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101216"/>
      <stop offset="55%" stop-color="#181C24"/>
      <stop offset="100%" stop-color="#12151C"/>
    </linearGradient>
    <linearGradient id="slipstreamRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E11D48" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FACC15" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="slipstreamYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0"/>
      <stop offset="65%" stop-color="#FACC15" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="chassisBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#28303E"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <pattern id="telemetryGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#28303E" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background Pit-Wall Telemetry Screen -->
  <rect width="680" height="460" fill="url(#asphaltGrad)"/>
  <rect width="680" height="460" fill="url(#telemetryGrid)"/>

  <!-- Top Telemetry Header Bar -->
  <rect x="20" y="18" width="640" height="34" fill="#181C24" stroke="#28303E" stroke-width="1"/>
  <rect x="20" y="18" width="8" height="34" fill="#E11D48"/>
  <text x="40" y="40" fill="#F1F5F9" font-family="Consolas, monospace" font-size="13" font-weight="bold">MIAOMIAO-YUN // GRAND PRIX IEPL TELEMETRY v4.8</text>
  <text x="515" y="40" fill="#FACC15" font-family="Consolas, monospace" font-size="13" font-weight="bold">DRS: ENABLED [0.8ms]</text>

  <!-- Left Dual Chronometer / Tachometer Ring -->
  <g transform="translate(155, 195)">
    <circle cx="0" cy="0" r="92" fill="#101216" stroke="#28303E" stroke-width="3"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="#E11D48" stroke-width="4" stroke-dasharray="160 90" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#FACC15" stroke-width="2.5" stroke-dasharray="55 35">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <!-- Sweeping Tachometer Needle -->
    <g>
      <line x1="0" y1="12" x2="0" y2="-64" stroke="#FACC15" stroke-width="3" stroke-linecap="round"/>
      <polygon points="-4,0 4,0 0,-68" fill="#E11D48"/>
      <animateTransform attributeName="transform" type="rotate" values="-110 0 0; 115 0 0; 85 0 0; 125 0 0; -110 0 0" keyTimes="0; 0.45; 0.65; 0.85; 1" dur="3.6s" repeatCount="indefinite"/>
    </g>
    <circle cx="0" cy="0" r="9" fill="#F1F5F9" stroke="#E11D48" stroke-width="3"/>
    <text x="0" y="36" text-anchor="middle" fill="#94A3B8" font-family="Consolas, monospace" font-size="10">CHRONO LATENCY</text>
    <text x="0" y="54" text-anchor="middle" fill="#FACC15" font-family="Consolas, monospace" font-size="16" font-weight="bold">11.4 ms</text>
  </g>

  <!-- Right Dual Chronometer / Bandwidth Ring -->
  <g transform="translate(525, 195)">
    <circle cx="0" cy="0" r="92" fill="#101216" stroke="#28303E" stroke-width="3"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="#FACC15" stroke-width="4" stroke-dasharray="190 70" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="66" fill="none" stroke="#E11D48" stroke-width="2" stroke-dasharray="30 22">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Sweeping Bandwidth Needle -->
    <g>
      <polygon points="-4,0 4,0 0,-66" fill="#FACC15"/>
      <animateTransform attributeName="transform" type="rotate" values="-90 0 0; 130 0 0; 110 0 0; 138 0 0; -90 0 0" keyTimes="0; 0.5; 0.7; 0.9; 1" dur="3.2s" repeatCount="indefinite"/>
    </g>
    <circle cx="0" cy="0" r="9" fill="#F1F5F9" stroke="#FACC15" stroke-width="3"/>
    <text x="0" y="36" text-anchor="middle" fill="#94A3B8" font-family="Consolas, monospace" font-size="10">PEAK THROUGHPUT</text>
    <text x="0" y="54" text-anchor="middle" fill="#F1F5F9" font-family="Consolas, monospace" font-size="16" font-weight="bold">10.0 Gbps</text>
  </g>

  <!-- Center Grand Prix Circuit Loop & Slipstream Wind Tunnel -->
  <g transform="translate(340, 195)">
    <polygon points="0,-78 68,-38 68,38 0,78 -68,38 -68,-38" fill="#141820" stroke="#E11D48" stroke-width="2"/>
    <polygon points="0,-62 54,-30 54,30 0,62 -54,30 -54,-30" fill="none" stroke="#FACC15" stroke-width="1.5" stroke-dasharray="8 6">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
    </polygon>
    <!-- Aerodynamic Wing Silhouette Inside Center -->
    <path d="M-38,10 L-12,-22 L38,-6 L18,6 L42,16 L-28,18 Z" fill="url(#chassisBody)"/>
    <text x="0" y="42" text-anchor="middle" fill="#FACC15" font-family="Consolas, monospace" font-size="11" font-weight="bold">AERO-CORE</text>
  </g>

  <!-- Aerodynamic Slipstream Flow Lines (Bottom Wind Tunnel Track) -->
  <g transform="translate(0, 315)">
    <rect x="20" y="0" width="640" height="122" fill="#131720" stroke="#28303E" stroke-width="1.5"/>

    <!-- Animated Wind-Tunnel Slipstream Vectors -->
    <line x1="40" y1="26" x2="220" y2="26" stroke="url(#slipstreamRed)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="x1" values="-180;640" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="20;840" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <line x1="80" y1="48" x2="310" y2="48" stroke="url(#slipstreamYellow)" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="x1" values="-240;640" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-10;870" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="30" y1="74" x2="260" y2="74" stroke="url(#slipstreamRed)" stroke-width="3.5" stroke-linecap="round">
      <animate attributeName="x1" values="-200;640" dur="1.25s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="30;870" dur="1.25s" repeatCount="indefinite"/>
    </line>
    <line x1="120" y1="96" x2="340" y2="96" stroke="url(#slipstreamYellow)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="x1" values="-220;640" dur="1.55s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;860" dur="1.55s" repeatCount="indefinite"/>
    </line>

    <!-- Sleek Formula Aerodynamic Silhouette Slicing Through Wind Tunnel -->
    <g transform="translate(215, 36)">
      <!-- Rear Wing -->
      <polygon points="0,4 18,4 12,38 -4,38" fill="#E11D48"/>
      <!-- Main Carbon Monocoque & Nose Cone -->
      <path d="M12,22 L75,10 L145,14 L225,28 L250,34 L225,38 L35,38 L12,32 Z" fill="url(#chassisBody)" stroke="#F1F5F9" stroke-width="1"/>
      <!-- Cockpit Halo -->
      <path d="M95,12 L135,14 L145,22 L88,22 Z" fill="#101216" stroke="#FACC15" stroke-width="1.5"/>
      <!-- Front Wing Endplate -->
      <polygon points="222,26 258,24 252,40 216,40" fill="#FACC15"/>
      <!-- Front & Rear Spinning Aero Wheels -->
      <circle cx="52" cy="38" r="14" fill="#101216" stroke="#FACC15" stroke-width="3" stroke-dasharray="14 8">
        <animateTransform attributeName="transform" type="rotate" from="0 52 38" to="360 52 38" dur="0.45s" repeatCount="indefinite"/>
      </circle>
      <circle cx="196" cy="38" r="14" fill="#101216" stroke="#E11D48" stroke-width="3" stroke-dasharray="14 8">
        <animateTransform attributeName="transform" type="rotate" from="0 196 38" to="360 196 38" dur="0.45s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Sector Timing Readout Overlay -->
    <rect x="36" y="14" width="138" height="26" fill="#101216" stroke="#E11D48" stroke-width="1"/>
    <text x="46" y="31" fill="#FACC15" font-family="Consolas, monospace" font-size="11" font-weight="bold">S1 PURPLE: 0.008s</text>

    <rect x="492" y="82" width="152" height="26" fill="#101216" stroke="#FACC15" stroke-width="1"/>
    <text x="502" y="99" fill="#22C55E" font-family="Consolas, monospace" font-size="11" font-weight="bold">ZERO PACKET LOSS</text>
  </g>
</svg>
